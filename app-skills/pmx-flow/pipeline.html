   screen with a Save Changes bar. Every value is built as DOM text: nothing from PMX is ever parsed as HTML. */
/* The colour and type tokens. The team board and PMX Engine's studio copy the lines between the two marks byte for byte; tests compare them. */

:root {
  --bg: #ffffff; --sunken: #f6f7f9; --card: #ffffff; --hover: #f1f3f6; --select: #e9eefb;
  --line: #e5e7ec; --line-2: #d5d9e0;
  --fg: #16181d; --fg-2: #505664; --fg-3: #687080;
  --accent: #3459c9; --accent-soft: #ecf1fd; --accent-fg: #ffffff;
  --today: #c99a00; --ok: #16793f; --ok-soft: #e8f6ee; --warn: #8f4b05; --warn-soft: #fdf3e4; --bad: #c53030; --bad-soft: #fdeeee;
  --ic-up: #c83a50; --ic-any: #2a8c7f;
  /* The flow map: where data is (this Mac, Claude, Linear, your repo, kept private). */

  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --r-s: 6px; --r-m: 10px; --r-l: 14px;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --accent: #6f97ff; --accent-soft: #1d2741; --accent-fg: #0d1220;

  --ic-up: #f07a8c; --ic-any: #5cc9b8; --mac: #7fb0db; --mac-soft: #1b2a37; --claude: #b892f0; --claude-soft: #2a2140; --linear: #5cc9b1; --linear-soft: #15332d; --repo: #d4bb7c; --repo-soft: #302a1b; --held: #e4a956; --held-soft: #3a2c17;

/* <<< tokens */
html, body { height: 100% }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/20px var(--font); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100% }
* { box-sizing: border-box }
[hidden] { display: none !important }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit }
p { margin: 0 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-s) }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0 }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round }
.num { font-variant-numeric: tabular-nums }
code, .mono { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere }
.muted { color: var(--fg-2) } .faint { color: var(--fg-3) } .small { font-size: 13px } .tiny { font-size: 12px }
.err { color: var(--bad); font-size: 12.5px }
.hint { color: var(--fg-2); font-size: 12.5px }

.app { display: grid; grid-template-columns: 244px minmax(0, 1fr); height: 100% }
/* nav */
.nav { background: var(--sunken); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 10px; gap: 2px; overflow-y: auto; padding-left: max(10px, env(safe-area-inset-left, 0px)) }
.ws { display: flex; align-items: center; gap: 10px; padding: 2px 8px 14px; min-width: 0 }
.ws > div { min-width: 0 }
.logo { width: 26px; height: 26px; border-radius: 7px; background: var(--fg); color: var(--bg); display: grid; place-items: center; font-weight: 700; font-size: 10px; letter-spacing: .02em; flex: none }
.ws b { font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.ws small { display: block; color: var(--fg-3); font-size: 11px; line-height: 14px }
.search { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--card); color: var(--fg-3) }
.search:focus-within { border-color: var(--accent) }
.search input { border: 0; background: none; outline: none; width: 100%; color: var(--fg); min-width: 0 }
.search input::-webkit-search-cancel-button { display: none }
.nav h6 { margin: 14px 10px 4px; font-size: 11px; font-weight: 500; color: var(--fg-3); letter-spacing: .02em }
.ni { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--fg); text-decoration: none; border: 0; background: none; width: 100%; text-align: left; font-size: 13.5px }
.ni:hover { background: var(--hover) }
.ni[aria-current="page"] { background: var(--select); font-weight: 500 }
.ni .badge { margin-left: auto; font-size: 12px; color: var(--fg-3) }
.ni .badge.hot { color: var(--bad); font-weight: 600 }
.ni .dot { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--accent) }
.ni .dot.bad { background: var(--bad) }
.ic-inbox { color: var(--accent) } .ic-today { color: var(--today) } .ic-up { color: var(--ic-up) } .ic-any { color: var(--ic-any) } .ic-log { color: var(--ok) }
.nav .spacer { flex: 1; min-height: 16px }
.conn { display: flex; gap: 8px; align-items: center; margin: 6px 4px 6px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--card); font-size: 12px; line-height: 16px; color: var(--fg-2); text-align: left }
.conn > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 3px var(--ok-soft) }
.conn.off i { background: var(--fg-3); box-shadow: 0 0 0 3px var(--hover) }
.conn.bad i { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft) }
.conn b { color: var(--fg); font-weight: 500 }
.navscrim { position: fixed; inset: 0; background: var(--scrim); z-index: 24 }

/* main */
.main { overflow-y: auto; position: relative; min-width: 0; scroll-padding-top: 64px }
.topbar { display: none }
.page { max-width: 780px; margin: 0 auto; padding-block: 36px 96px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)) }
.ph { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 22px }
.ph > div { flex: 1 1 0; min-width: 0 }
.ph .big { width: 30px; height: 30px; stroke-width: 1.8; margin-top: 2px }
.ph h1 { margin: 0; font-size: 24px; line-height: 30px; font-weight: 650; letter-spacing: -.01em; text-wrap: balance }
.ph h1:focus { outline: none }
.ph p { margin: 3px 0 0; color: var(--fg-2) }
.ph .act { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center }
.strip { display: flex; gap: 8px 16px; flex-wrap: wrap; color: var(--fg-2); font-size: 12.5px; margin: -8px 0 20px 44px }
.strip span, .strip button { display: inline-flex; gap: 6px; align-items: center }
.strip button { border: 0; background: none; padding: 0; color: inherit; font-size: inherit; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px }
.banner { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; max-width: 716px; margin: 16px auto 0; background: var(--warn-soft); color: var(--fg); border-radius: var(--r-m); padding: 10px 12px; font-size: 13px }
.banner.bad { background: var(--bad-soft) }
.banner > span { flex: 1 1 260px }
.page .banner { margin: 0 0 16px; max-width: none }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-s); border: 1px solid var(--line-2); background: var(--card); font-size: 13px; font-weight: 500; white-space: nowrap; text-decoration: none; line-height: 18px }
.btn:hover { background: var(--hover) }
.btn.pri { background: var(--accent); border-color: var(--accent); color: var(--accent-fg) }
.btn.pri:hover { filter: brightness(1.07) }
.btn.ghost { border-color: transparent; background: none; color: var(--fg-2) }
.btn.ghost:hover { background: var(--hover); color: var(--fg) }
.btn.danger { color: var(--bad) }
.btn.sm { padding: 3px 9px; font-size: 12.5px }
.btn:disabled { opacity: .45; cursor: default; filter: none }
.btn .spin, .spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; display: inline-block; flex: none }
@keyframes spin { to { transform: rotate(360deg) } }
.link { border: 0; background: none; padding: 0; color: var(--fg); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; font-size: inherit; text-align: left }
.link:hover { text-decoration-color: var(--fg) }

.group { margin-top: 26px }
.group:first-of-type { margin-top: 0 }
.gh { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; padding: 0 0 6px 6px; border-bottom: 1px solid var(--line); margin-bottom: 4px }
.gh h2 { margin: 0; font-size: 14px; font-weight: 650; color: var(--accent) }
.gh.plain h2 { color: var(--fg) }
.gh .dn { font-size: 20px; margin-right: 6px }
.gh .c { color: var(--fg-3); font-size: 12px }
.gh .r { margin-left: auto; display: flex; gap: 6px; align-items: center }
.gnote { color: var(--fg-2); font-size: 12.5px; padding: 2px 10px 6px }

.row { display: flex; align-items: flex-start; gap: 12px; padding: 8px 10px; border-radius: 8px; position: relative; transition: background .12s, opacity .2s, max-height .25s var(--ease), padding .25s var(--ease); max-height: 600px }
.row:hover { background: var(--hover) }
.row.sel { background: var(--select) }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.row .body { flex: 1; min-width: 0 }
.row .t { display: block; line-height: 20px; overflow-wrap: anywhere }
.row .m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 2px; font-size: 12px; color: var(--fg-2); line-height: 18px }
.row .m .over { color: var(--bad); font-weight: 500 }
.row .m .soon { color: var(--fg); font-weight: 600 }
.row .m a { color: var(--fg-2) }
.row .m svg.i { width: 13px; height: 13px }
.row .acts { display: flex; gap: 6px; flex: none; align-self: center; flex-wrap: wrap; justify-content: flex-end }
.row .acts .sa { display: none }
.row:hover .acts .sa, .row.sel .acts .sa, .row:focus-within .acts .sa { display: inline-flex }
.row.gone { max-height: 0; padding-block: 0; opacity: 0; overflow: hidden }
.row.ghostrow { color: var(--fg-3) }
.row.ghostrow .m { color: var(--fg-3) }
.row.ghostrow:hover { background: none }
.row .tm { min-width: 74px; justify-content: center }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 0 7px; border-radius: 999px; background: var(--hover); color: var(--fg-2); font-size: 11.5px; line-height: 18px; white-space: nowrap }
.chip.k { background: var(--accent-soft); color: var(--accent) }
.chip.ok { background: var(--ok-soft); color: var(--ok) }
.chip.warn { background: var(--warn-soft); color: var(--warn) }
.chip.bad { background: var(--bad-soft); color: var(--bad) }
.chip.new { background: none; border: 1px dashed var(--accent); color: var(--accent) }

/* checkboxes */
.ck { width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--card); flex: none; margin-top: 1px; display: grid; place-items: center; padding: 0; transition: background .15s, border-color .15s; color: var(--fg-2) }
.ck:hover { border-color: var(--fg-3) }
.ck svg.tick { width: 11px; height: 11px; stroke: var(--accent-fg); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 16; stroke-dashoffset: 16; transition: stroke-dashoffset .2s .08s var(--ease) }
.row.done .ck, .ck.filled { background: var(--accent); border-color: var(--accent) }
.row.done .ck svg.tick, .ck.filled svg.tick { stroke-dashoffset: 0 }
.row.done .t { color: var(--fg-3); text-decoration: line-through }
.ck.prop { border-style: dashed; border-color: var(--accent) }
.row.done .ck.prop { border-style: solid }
.ck.sys { border-radius: 6px; border: 0; background: none }
.ck.sys svg.i { width: 18px; height: 18px }
.ck.sys.bad { color: var(--bad) } .ck.sys.warn { color: var(--warn) } .ck.sys.ok { color: var(--ok) }
.ck.ev { border-style: dotted; border-color: var(--fg-3); cursor: default; background: none }
.ck.star { border: 0; background: none; color: var(--today) }

.why { margin: 8px 0 2px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--card); font-size: 13px; color: var(--fg-2); white-space: pre-wrap; overflow-wrap: anywhere }
.why b { color: var(--fg); font-weight: 600 }
.note { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap }
.note input { flex: 1; min-width: 180px }
.empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 56px 16px; color: var(--fg-2); text-align: center }
.empty svg.i { width: 34px; height: 34px; stroke-width: 1.3; color: var(--fg-3) }
.empty p { margin: 0; max-width: 46ch }
.someday { margin-top: 18px }
.someday summary { cursor: pointer; color: var(--fg-2); padding: 6px; list-style: none; display: flex; gap: 6px; align-items: center; font-weight: 600; font-size: 13px; border-radius: var(--r-s) }
.someday summary::-webkit-details-marker { display: none }
.someday summary svg.i { transition: transform .15s }

.fab { position: fixed; right: max(28px, env(safe-area-inset-right, 0px)); bottom: max(28px, env(safe-area-inset-bottom, 0px)); width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-fg); box-shadow: var(--shadow); display: grid; place-items: center; z-index: 5 }
.fab svg.i { width: 20px; height: 20px; stroke-width: 2.2 }

/* inputs */
.in { padding: 5px 10px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--card); min-width: 0; max-width: 100%; font-size: 13px; line-height: 20px }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft) }
.in::placeholder { color: var(--fg-3); opacity: 1 }
.in.bad { border-color: var(--bad) }
textarea.in { width: 100%; resize: vertical; line-height: 20px }
select.in { padding-right: 6px }
input.in[type="number"] { width: 84px }
details.term { font-size: 12px; color: var(--fg-3); margin-top: 6px; flex-basis: 100% }
details.term summary { cursor: pointer; display: inline; list-style: none }
details.term summary::-webkit-details-marker { display: none }
details.term summary::after { content: " ›" }
details.term[open] summary::after { content: " ⌄" }
.cmdline { font-family: var(--mono); font-size: 12px; background: var(--hover); border-radius: var(--r-s); padding: 6px 8px; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 6px; display: flex; gap: 8px; justify-content: space-between; align-items: center; color: var(--fg-2) }
.cmdline button { border: 0; background: none; font-family: var(--font); font-size: 12px; color: var(--fg-2); padding: 0 4px; min-height: 24px }
.fixacts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }

/* detail sheet */
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--card); border-left: 1px solid var(--line); box-shadow: var(--shadow); transform: translateX(102%); visibility: hidden; transition: transform .22s var(--ease), visibility 0s linear .22s; z-index: 20; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
.sheet.open { transform: none; visibility: visible; transition: transform .22s var(--ease) }
.sheet header { display: flex; align-items: center; gap: 8px; padding: 14px 18px; border-bottom: 1px solid var(--line); color: var(--fg-2); font-size: 12.5px }
.sheet header .x { margin-left: auto }
.sheet .sb { padding: 20px 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; flex: 1 }
.sheet h3 { margin: 0; font-size: 18px; line-height: 24px; font-weight: 650; text-wrap: balance; overflow-wrap: anywhere }
.sheet h3:focus { outline: none }
.lbl { font-size: 11.5px; color: var(--fg-3); font-weight: 500; letter-spacing: .03em; text-transform: uppercase; margin-bottom: 6px }
.sheet p { color: var(--fg-2) }
.sheet .desc { white-space: pre-wrap; overflow-wrap: anywhere }
.sheet .foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap }
.when { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.when button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent) }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.two ul, .sheet ul { margin: 0; padding-left: 16px; color: var(--fg-2); font-size: 13px }

/* toast & modal */
.toast { position: fixed; left: 50%; bottom: max(28px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, calc(100% + 80px)); visibility: hidden; background: var(--fg); color: var(--bg); padding: 7px 8px 7px 16px; border-radius: 10px; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); transition: transform .22s var(--ease), visibility 0s linear .22s; z-index: 40; font-size: 13px; max-width: min(640px, calc(100% - 32px)) }
.toast.show { transform: translate(-50%, 0); visibility: visible; transition: transform .22s var(--ease) }
.toast .tt { overflow-wrap: anywhere }
.toast button, .toast a { background: none; border: 0; color: var(--bg); font-weight: 600; padding: 4px 8px; border-radius: 6px; opacity: .9; white-space: nowrap; display: inline-flex; align-items: center }
.toast button:hover, .toast a:hover { opacity: 1; background: var(--toast-hover) }
.toast :focus-visible { outline-color: var(--bg) }
.scrim { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: start center; padding: 12vh 16px 16px; z-index: 30; overflow-y: auto }
.modal { width: min(560px, 100%); background: var(--card); border-radius: var(--r-l); box-shadow: var(--shadow); border: 1px solid var(--line); overflow: hidden }
.modal.wide { width: min(640px, 100%) }
.qe { display: flex; gap: 12px; align-items: flex-start; padding: 16px 18px }
.qe input { flex: 1; border: 0; outline: none; background: none; font-size: 16px; line-height: 22px; min-width: 0 }
.qe-meta { display: flex; gap: 8px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--line); background: var(--sunken); color: var(--fg-2); font-size: 12.5px; flex-wrap: wrap }
.qe-meta .r { margin-left: auto; display: flex; gap: 8px }
.modal h3 { margin: 0; padding: 18px 20px 4px; font-size: 16px }
.modal h3:focus { outline: none }
.modal .mb { padding: 6px 20px 16px; color: var(--fg-2); display: grid; gap: 10px }
.modal .mf { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--sunken) }
.chg { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); color: var(--fg); flex-wrap: wrap }
.chg:last-child { border-bottom: 0 }
.chg > span:first-child { flex: 1 1 220px; overflow-wrap: anywhere }
.chg .chips { margin-left: auto }
.chg h4 { margin: 10px 0 0; font-size: 12px; color: var(--fg-3); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; flex-basis: 100% }
.result { background: var(--ok-soft); color: var(--fg); border-radius: var(--r-m); padding: 10px 12px; font-size: 13px }
.result.bad { background: var(--bad-soft) }
kbd { font: 11px var(--mono); padding: 1px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; color: var(--fg-2); background: var(--card) }
.keys { margin: 4px 20px 18px; border-collapse: collapse; font-size: 13px; color: var(--fg-2) }

.keys td + td { white-space: normal }
.theme { display: flex; gap: 6px; flex-wrap: wrap }

/* plan / agents / digest / status */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 24px }
.stat { border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; background: var(--card); min-width: 0 }
.stat small { color: var(--fg-2); font-size: 12px; display: block }
.stat b { display: block; font-size: 22px; line-height: 28px; font-weight: 600 }
.callout { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 16px; background: var(--card); margin-bottom: 22px }
.callout > div { flex: 1 1 280px; min-width: 0 }
.callout p { color: var(--fg-2); font-size: 13px; margin-top: 2px }
.meter { position: relative; height: 6px; border-radius: 99px; background: var(--hover); width: 120px; flex: none }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); border-radius: 99px }
.meter i.low { background: var(--bad) }
.meter b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg-3) }
.doc { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--card); padding: 22px 26px; line-height: 22px; margin-bottom: 18px }
.doc header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between }
.doc header h2 { margin: 0; font-size: 18px }
.facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--fg-2); margin: 4px 0 14px }
.facts b { color: var(--fg); font-weight: 600 }
.digest-doc { max-width: 72ch; overflow-wrap: anywhere }
.digest-doc h3 { font-size: 15px; margin: 18px 0 6px }
.digest-doc h4 { font-size: 14px; margin: 14px 0 4px }
.digest-doc ul { margin: 4px 0; padding-left: 20px; display: grid; gap: 4px }
.digest-doc p, .digest-doc li { color: var(--fg-2); margin: 6px 0 }
.digest-doc li { margin: 0 }
.digest-doc .lede { color: var(--fg-3); font-size: 13px; font-style: italic }
.digest-doc li.flash { background: var(--warn-soft); border-radius: 4px }
.cite { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); border: 0; vertical-align: 1px }
.reader-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px }
.reader-bar .acts { display: flex; gap: 8px; flex-wrap: wrap }
/* Flow: the map (BOARD-3) */
.page.wide { max-width: 1240px }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--r-s); overflow: hidden; background: var(--card) }
.seg button { border: 0; background: none; padding: 5px 12px; font-size: 13px; color: var(--fg-2) }
.seg button + button { border-left: 1px solid var(--line-2) }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--fg); font-weight: 500 }
details.legend { font-size: 13px; color: var(--fg-2); margin: 0 0 12px }
details.legend summary { cursor: pointer; width: max-content }
.key { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--fg-2); margin-top: 8px; align-items: center }
.key > span { display: inline-flex; align-items: center; gap: 7px }
.key svg { width: 28px; height: 8px; overflow: visible }
.key .pillkey { font-family: var(--mono); font-size: 11px; background: var(--fg); color: var(--bg); border-radius: 999px; padding: 0 7px }
.fconn { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px }
.fmain { min-width: 0 }
@media (min-width: 1180px) { .fconn { grid-template-columns: minmax(0, 1fr) 320px; align-items: start } .fdetail { position: sticky; top: 16px } .fdetail .backmap { display: none } }
.mapbox { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 8px; overflow-x: auto }
svg.map { display: block; width: 100%; min-width: 760px; height: auto; font-family: var(--font) }
.map .band { font-size: 12px; letter-spacing: 0.07em; text-transform: uppercase; fill: var(--fg-3); font-weight: 600 }
.map .divider { stroke: var(--line-2); stroke-dasharray: 4 4 }
.map .node rect.box { stroke-width: 1.5 }
.map .node .t { font-size: 14.5px; font-weight: 600; fill: var(--fg) }
.map .node .s { font-size: 13px; fill: var(--fg-2) }
.map .node .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.05em }
.map .node, .map .edge, .map .badge { cursor: pointer; transition: opacity 150ms }
.map .node .halo { fill: none; stroke: var(--fg); stroke-width: 2; opacity: 0 }
.map .node:hover rect.box { stroke-width: 2.5 }
.map .node.sel rect.box { stroke-width: 3 }
.map .node.sel .halo { opacity: 0.55 }
.map g:focus-visible { outline: none }
.map .node:focus-visible rect.box { stroke: var(--fg); stroke-width: 3; stroke-dasharray: none }
.map .queue rect { fill: var(--fg) }
.map .queue text { fill: var(--bg); font-family: var(--mono); font-size: 12px; font-weight: 600 }
.map .queue.zero { opacity: 0 }
.map.has-sel .node:not(.sel):not(.adj), .map.has-sel .edge:not(.sel):not(.adj), .map.has-sel .badge:not(.adj) { opacity: 0.35 }
.k-app rect.box { fill: var(--card); stroke: var(--fg-3) } .k-app .tag { fill: var(--fg-3) }
.k-mac rect.box { fill: var(--mac-soft); stroke: var(--mac) } .k-mac .tag { fill: var(--mac) }
.k-claude rect.box { fill: var(--claude-soft); stroke: var(--claude) } .k-claude .tag { fill: var(--claude) }
.k-linear rect.box { fill: var(--linear-soft); stroke: var(--linear) } .k-linear .tag { fill: var(--linear) }
.k-repo rect.box { fill: var(--repo-soft); stroke: var(--repo) } .k-repo .tag { fill: var(--repo) }
.k-held rect.box { fill: var(--held-soft); stroke: var(--held); stroke-dasharray: 5 3 } .k-held .tag { fill: var(--held) }
.k-off rect.box { fill: var(--card); stroke: var(--fg-3); stroke-dasharray: 3 3 } .k-off .t, .k-off .s { fill: var(--fg-3) }
.map .edge path.l { fill: none; stroke-width: 2.2 }
.map .edge .hit { stroke: transparent; stroke-width: 16; fill: none }
.e-full path.l, .kl-full { stroke: var(--mac); stroke-width: 2 }
.e-model path.l, .kl-model { stroke: var(--claude); stroke-width: 3.5 }
.e-linear path.l, .kl-linear { stroke: var(--linear); stroke-width: 3; stroke-dasharray: 12 3 2 3 }
.e-status path.l, .kl-status { stroke: var(--fg-3); stroke-width: 1.5 }
.e-held path.l, .kl-held { stroke: var(--held); stroke-width: 2; stroke-dasharray: 6 4 }
.e-off path.l, .kl-off { stroke: var(--fg-3); stroke-width: 2; stroke-dasharray: 2 4 }
.map .edge:hover path.l, .map .edge:focus-visible path.l { stroke-width: 4.5 }
.map .edge.sel path.l { stroke-width: 5 }
.map .badge rect { fill: var(--card); stroke: var(--line-2) }
.map .badge text { font-family: var(--mono); font-size: 12.5px; fill: var(--fg); font-weight: 500 }
/* Zeros stay quiet: an arrow shows a number only once something moved on it. */
.map .badge.zero { opacity: 0; pointer-events: none }
.map .badge.new rect { stroke: var(--fg); stroke-width: 2 }
.map .pulse { fill: var(--fg) }
table.flist { width: 100%; border-collapse: collapse; font-size: 13px }
table.flist th, table.flist td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top }
table.flist th { font-size: 12px; color: var(--fg-2); font-weight: 600 }
table.flist .n { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums }
table.flist tr.grp td { background: var(--sunken); font-weight: 600; font-size: 12px; color: var(--fg-2) }
.kindchip { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; white-space: nowrap }
.kindchip.full { background: var(--mac-soft); color: var(--mac) } .kindchip.model { background: var(--claude-soft); color: var(--claude) }
.kindchip.linear { background: var(--linear-soft); color: var(--linear) } .kindchip.status { background: var(--sunken); color: var(--fg-2) }
.kindchip.held { background: var(--held-soft); color: var(--held) } .kindchip.off { background: var(--sunken); color: var(--fg-3) }
.fdetail { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-l); padding: 16px; min-width: 0 }
.fdetail .eyebrow { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--fg-3); font-weight: 600 }
.fdetail h2 { margin: 3px 0 6px; font-size: 17px }
.fdetail h2:focus { outline: none }
.fdetail h3 { font-size: 13px; margin: 14px 0 0 }
.fdetail p + p { margin-top: 6px }
.fdetail .backmap { margin-bottom: 8px }
.fdetail dl.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin: 10px 0 }
.fdetail dl.kv dt { color: var(--fg-2); font-size: 13px }
.fdetail dl.kv dd { margin: 0; font-size: 13px; text-align: right; font-variant-numeric: tabular-nums }
.fdetail .carry { border-radius: var(--r-s); padding: 9px 11px; font-size: 13px; margin: 10px 0; background: var(--sunken); display: grid; gap: 4px; justify-items: start }
.fdetail .carry.full { background: var(--mac-soft) } .fdetail .carry.model { background: var(--claude-soft) } .fdetail .carry.linear { background: var(--linear-soft) } .fdetail .carry.held { background: var(--held-soft) }
.fdetail .carry .mini, .fdetail .carry .link { margin-top: 2px }
.fdetail .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto }
.tabs button { border: 0; background: none; padding: 8px 12px; color: var(--fg-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--fg); font-weight: 500 }
.statusline { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 16px; background: var(--card); margin-bottom: 22px }
.statusline > div { flex: 1 1 240px; min-width: 0 }
.statusline .bigic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--ok-soft); color: var(--ok); flex: none }

.statusline.bad .bigic { background: var(--bad-soft); color: var(--bad) }
.statusline small { display: block; color: var(--fg-2); font-size: 13px }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0 }
.step { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 0 12px }
.step .rail { display: flex; flex-direction: column; align-items: center }
.step .rail span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--hover); color: var(--fg-2); font-size: 12px; font-weight: 600; flex: none }
.step .rail i { flex: 1; width: 2px; background: var(--line); margin: 4px 0 }
.step:last-child .rail i { display: none }
.step.mac .rail span { background: var(--ok-soft); color: var(--ok) }
.step.claude .rail span { background: var(--accent-soft); color: var(--accent) }
.step.linear .rail span { background: var(--warn-soft); color: var(--warn) }
.step .box { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--card); padding: 12px 14px; margin-bottom: 14px; min-width: 0 }
.step .box header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
.step .box header b { font-size: 14px }
.step .box ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; font-size: 13px }
.step .box li { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap }
.step .box li b { font-weight: 600; font-variant-numeric: tabular-nums }
.step .box p { color: var(--fg-2); font-size: 12.5px; margin-top: 8px }
.step .box .fixacts { margin-top: 8px }
.cat { border: 1px solid var(--line); border-radius: var(--r-l); background: var(--card); margin-bottom: 12px }
.cat.off { background: transparent }
.cat > header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 12px; padding: 14px 16px 10px; flex-wrap: wrap }
.cat > header > div:first-child { flex: 1 1 300px; min-width: 0 }

.cat .cb { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line) }
.cat .cb > div { padding: 12px 16px; border-right: 1px solid var(--line); display: grid; gap: 6px; align-content: start; font-size: 13px; min-width: 0 }

.lab { font-size: 11px; letter-spacing: .05em; font-weight: 600; text-transform: uppercase; color: var(--fg-3) }
.rate { font-size: 22px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums }

dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 8px 0 0; font-size: 13px }
dl.kv dt { color: var(--fg-3) } dl.kv dd { margin: 0; overflow-wrap: anywhere }
.stage h3 { font-size: 14px; margin: 26px 0 4px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }

.weekrow { display: grid; grid-template-columns: 140px 120px minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 10px; border-bottom: 1px solid var(--line); font-size: 13px }

/* connect */

.connect details { font-size: 13px; color: var(--fg-2) }
.connect details summary { cursor: pointer }
.loading { color: var(--fg-3); padding: 48px 4px; text-align: center }

/* settings */
.set { display: grid; grid-template-columns: 230px minmax(0, 1fr); min-height: 100% }

.set-main > p.d { margin: 4px 0 22px; color: var(--fg-2) }
.sc { border: 1px solid var(--line); background: var(--sunken); border-radius: var(--r-l); padding: 4px; margin-bottom: 18px; min-width: 0 }
.sc-h { display: flex; align-items: flex-start; flex-wrap: wrap; gap: 8px 10px; padding: 12px 14px 10px }
.sc-h .tt { flex: 1 1 240px; min-width: 0 }
.sc-h b { font-weight: 600 }
.sc-h small { display: block; color: var(--fg-2); font-size: 13px; line-height: 18px; margin-top: 1px }
.sc-h .tog { border: 0; background: none; padding: 2px; color: var(--fg-2); transition: transform .15s; border-radius: var(--r-s) }
.sc.closed .sc-h .tog { transform: rotate(-90deg) }
.sc.closed .sc-b { display: none }
.sc-b.pad { padding: 12px 14px; display: grid; gap: 8px }
details.why summary { cursor: pointer; font-size: 13px; color: var(--fg-2) }
.mlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 2px }

@media (max-width: 560px) { .mlist li { grid-template-columns: minmax(0, 1fr); gap: 2px 10px; justify-items: start } .mlist .t { white-space: normal } }
.sc-b { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); padding: 2px 0; min-width: 0 }
.sr { display: flex; align-items: center; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); min-height: 52px; flex-wrap: wrap; min-width: 0 }
.sr:last-child { border-bottom: 0 }
.sr > svg.i { color: var(--fg-2) }
.sr .nm { flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere }
.sr .nm small { display: block; color: var(--fg-2); font-size: 12px; line-height: 16px; margin-top: 1px }
.sr .ctl { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap }

.sw { position: relative; width: 34px; height: 20px; border-radius: 99px; background: var(--line-2); border: 0; padding: 0; transition: background .15s; flex: none }

.mw { position: relative; display: inline-flex }

.mor:hover, .mor[aria-expanded="true"] { background: var(--hover) }
.menu { position: absolute; right: 0; top: calc(100% + 4px); min-width: 190px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: var(--shadow); padding: 4px; z-index: 15; display: grid }

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0 }

.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none }

.savebar span { color: var(--fg-2); font-size: 12.5px }
.gets { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px }
.gets ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--fg-2); display: grid; gap: 3px }
.sizegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; padding: 12px 16px }
.sizegrid > div { display: grid; gap: 6px; font-size: 13px }

.kf { display: grid; gap: 14px; padding: 14px 16px; min-width: 0 }

.rub:last-child { border-bottom: 0 }

/* Narrow panes (Claude's side panel): the nav stays, slimmer; settings sections become a row of tabs. */
@media (max-width: 1000px) {
  .app { grid-template-columns: 208px minmax(0, 1fr) }

  .cat .cb > div:last-child { border-bottom: 0 }
}
/* Below ~760px Settings stacks: the grouped sub-nav becomes one grouped section picker. */
.set-pick { display: none }
@media (max-width: 760px) {
  .set { grid-template-columns: minmax(0, 1fr) }

  .set-pick { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--fg-2) }
  .set-pick select { flex: 1; max-width: 360px }
}
@media (max-width: 640px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .nav { position: fixed; inset: 0 auto 0 0; width: 264px; z-index: 25; transform: translateX(-102%); visibility: hidden; transition: transform .2s var(--ease), visibility 0s linear .2s; box-shadow: var(--shadow); padding-top: max(16px, env(safe-area-inset-top, 0px)) }
  .app.navopen .nav { transform: none; visibility: visible; transition: transform .2s var(--ease) }
  .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 4; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: max(10px, env(safe-area-inset-top, 0px)) 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .topbar button { border: 0; background: none; padding: 4px; border-radius: var(--r-s) }
  .topbar .tb-b { margin-left: auto; font-size: 12px; color: var(--fg-2) }
  .page { padding-block: 22px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .banner { margin-left: 16px; margin-right: 16px }
  .strip { margin-left: 0 }
  .ph { flex-wrap: wrap }
  .ph .act { margin-left: 0; flex-basis: 100%; justify-content: flex-start }
  .row { flex-wrap: wrap }
  .row .acts { flex-basis: 100%; padding-left: 31px; justify-content: flex-start }
  .row .acts .sa { display: inline-flex }
  .btn { padding: 8px 12px } .btn.sm { padding: 6px 10px }
  .set-side { padding: 18px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)) }
  .set-main { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)) }
  .two { grid-template-columns: 1fr }

  .fab { right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)) }
}

<script>
(() => {
  "use strict";
  // ================= mode, config and transport =================
  // "local": this Mac's page from `pmx flow --web`, which reads and writes through PMX's loopback server with a token.
  // "artifact": the /pmx-flow Claude artifact. It reaches PMX on the viewer's Mac through the Claude app (host:pmx):
  // unpaired it can only count (FLOW-6); once the PM allows it on the Mac (pair), it is the full workspace (FLOW-5).
  const CFG = (() => { try { return JSON.parse(document.getElementById("pmx-config").textContent || "{}"); } catch { return {}; } })();
  if (!document.documentElement.lang) document.documentElement.lang = "en";
  const LOCAL = CFG.mode === "local";
  const safeStore = (name) => { try { return window[name] || null; } catch { return null; } };
  const LS = safeStore("localStorage"), SS = safeStore("sessionStorage");
  const store = {
    get(k, st = LS) { try { return st ? st.getItem(k) : null; } catch { return null; } },
    set(k, v, st = LS) { try { if (!st) return false; if (v == null) st.removeItem(k); else st.setItem(k, v); return true; } catch { return false; } },
  };
  // The link from Terminal carries the token as #t=…, optionally with &tab=…. It moves to this tab's session storage so
  // a reload keeps working, and leaves the address bar for the page's own routes.
  let TOKEN = "";
  if (LOCAL) {
    const lp = new URLSearchParams(location.hash.slice(1));
    TOKEN = lp.get("t") || store.get("pmx-t", SS) || "";
    if (lp.get("t")) { store.set("pmx-t", TOKEN, SS); try { history.replaceState(null, "", `${location.pathname}#${lp.get("tab") || "today"}`); } catch {} }
  }
  // The pairing key (FLOW-4, PRIV-7): kept only in this page's own storage, or in memory where storage is blocked.
  let memKey = null;
  const getKey = () => store.get("pmx-key") || memKey;
  const setKey = (k) => { memKey = k; store.set("pmx-key", k); };

  const fail = (message, extra) => Object.assign(new Error(message), { pmx: true }, extra || {});
  const HELP = {
    no_app: "This page reaches PMX on your Mac through the Claude desktop app. Open it in the Claude app on the Mac where PMX runs.",
    server_not_connected: "The Claude app can't reach PMX on this Mac. PMX may not be registered with the app yet, or the app needs a restart since PMX was installed.",
    not_granted: "This view can't reach PMX. Open the page in the Claude desktop app on your Mac.",
    capability_disabled: "This view can't reach PMX. Open the page in the Claude desktop app on your Mac.",
    capability_removed: "This view can't reach PMX. Open the page in the Claude desktop app on your Mac.",
    approval_required: "The Claude app needs your OK before this page can use PMX. Click Try again and choose Allow.",
    not_in_manifest: "PMX is turned off for this page. Turn it back on in the page's permissions.",
    blocked_by_policy: "Your organization doesn't allow this page to use PMX.",
    selection_required: "Choose which PMX to use when the Claude app asks.",
    cancelled: "You declined in the Claude app, so nothing ran.",
    server_unavailable: "PMX on this Mac didn't answer in time. Try again in a moment.",
    old_server: "The Claude app is still running PMX's server from an older pmx, which doesn't know this page yet. Quit the Claude app completely (⌘Q, not just its window) and open it again. That starts the new server, which updates itself from now on.",
    upstream_error: "PMX on this Mac didn't answer. Try again in a moment.",
    not_paired: "This page isn't connected to PMX on this Mac yet.",
    declined: "Not connected: you chose Don't Allow on the Mac, or nobody answered within 2 minutes.",
  };
  const parseJson = (s) => { try { return typeof s === "string" ? JSON.parse(s) : null; } catch { return null; } };
  // A rejected host:pmx call, in this page's terms. Tool failures carry PMX's own answer, like {code: "not_paired"}.
  function fromTool(e) {
    if (e && e.pmx) return e;
    const code = e && e.code;
    // A server from an older pmx doesn't have this page's tools (pair, board…): the Claude app is still running it.
    if (code === "tool_not_found" || code === "unknown_tool" || code === "method_not_found" || /unknown tool|tool not found|no such tool|-32601|-32602/i.test(String((e && e.message) || ""))) return fail(HELP.old_server, { code: "old_server" });
    if (code === "tool_error") {
      const r = (e && e.result) || {};
      const p = r.structuredContent || r.payload || (Array.isArray(r.content) && r.content[0] && parseJson(r.content[0].text)) || parseJson(e.message) || {};
      if (p.code === "not_paired" || /not_paired|isn't connected to PMX/i.test(String(e.message || ""))) return fail(HELP.not_paired, { code: "not_paired" });
      if (p.code === "declined") return fail(HELP.declined, { code: "declined" });
      return fail(p.error || (e && e.message) || "PMX reported a problem.", { code: "tool_error" });
    }
    return fail(HELP[code] || (e && e.message) || HELP.upstream_error, { code: code || "upstream_error", retryable: !!(e && e.retryable) });
  }
  let mcpP = null;
  const mcpNs = () => {
    if (!mcpP) mcpP = window.claude && typeof window.claude.use === "function" ? Promise.resolve(window.claude.use("mcp")).catch(() => null) : Promise.resolve(null);
    return mcpP;
  };
  async function host(tool, args, opts) {
    const m = await mcpNs();
    if (!m) throw fail(HELP.no_app, { code: "no_app" });
    let r;
    try { r = await m.callTool("host:pmx", tool, args, opts); } catch (e) { throw fromTool(e); }
    const p = r ? r.payload : null;
    if (p && typeof p === "object" && !("status" in p) && p.error) {
      if (p.code === "not_paired") throw fail(HELP.not_paired, { code: "not_paired" });
      if (p.code === "declined") throw fail(HELP.declined, { code: "declined" });
      throw fail(p.error, { code: "tool_error" });
    }
    return p;
  }
  // This Mac's loopback server. Non-2xx throws an Error with .status and .body.
  async function api(path, body) {
    let res;
    try {
      res = await fetch(path, { method: body ? "POST" : "GET", headers: { authorization: `Bearer ${TOKEN}`, ...(body ? { "content-type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
    } catch { throw fail("PMX isn't answering on this Mac.", { status: 0 }); }
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw fail(j.error || `PMX answered ${res.status}.`, { status: res.status, body: j });
    return j;
  }
  // The two doors every view goes through: read the workspace, and act on it.
  async function read(h) {
    if (LOCAL) return (await api(`/api/pipeline?hours=${h}`)).pipeline;
    const key = getKey();
    if (!key) throw fail(HELP.not_paired, { code: "not_paired" });
    const p = await host("board", { key, hours: h }, { cache: false });
    if (!p || typeof p !== "object" || !p.edges) throw fail("PMX answered in a shape this page doesn't know. Update PMX, then publish the page again.", { code: "bad_shape" });
    return p;
  }
  async function act(path, body) {
    if (LOCAL) return api(`/api/pipeline/${path}`, body);
    const key = getKey();
    if (!key) throw fail(HELP.not_paired, { code: "not_paired" });
