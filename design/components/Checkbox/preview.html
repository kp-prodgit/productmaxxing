<!-- @dsCard group="Inputs" height=216 -->
<!doctype html><html><head><meta charset="utf-8"><style>.pv{padding:24px;display:grid;gap:20px}.r{display:flex;flex-wrap:wrap;gap:12px;align-items:center}</style></head><body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-mac" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14M21 3l-6.5 18-4-8-8-4z"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M11 3l1.9 5.6L18.5 10l-5.6 1.9L11 17.5l-1.9-5.6L3.5 10l5.6-1.4L11 3z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-bubble" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-8 8H4l2.5-3A8 8 0 1 1 21 12z"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18.5" cy="12" r="1"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13 7 4 4"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3A4 4 0 0 0 13 5.3l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
</defs></svg>
<div class="pv">
<div class="r" style="align-items:flex-start;gap:48px">
<ul style="list-style:none;padding:0;display:grid;gap:8px">
<li class="r" style="gap:8px"><button class="ck" type="button" role="checkbox" aria-checked="false" aria-label="Done: Send the Engineering brief to Omar"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg></button>Send the Engineering brief to Omar</li>
<li class="r" style="gap:8px"><button class="ck" type="button" role="checkbox" aria-checked="true" aria-label="Done: Agree pricing tiers with Elena"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg></button>Agree pricing tiers with Elena</li>
<li class="r" style="gap:8px"><button class="ck prop" type="button" role="checkbox" aria-checked="false" aria-label="Accept and mark done: Book the field review with Jun"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg></button>Book the field review with Jun <span class="pill plain">Proposed</span></li>
<li class="r" style="gap:8px"><button class="ck" type="button" role="checkbox" aria-checked="false" aria-label="Done: Record sign-off from Ana" disabled><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg></button>Record sign-off from Ana</li>
</ul>
<fieldset style="border:0;margin:0;padding:0;display:grid;gap:4px"><legend style="padding:0;margin-bottom:4px"><b>Release to</b></legend>
<label class="cb"><input type="checkbox" id="all"><span class="box"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg></span>All groups</label>
<label class="cb"><input type="checkbox" checked><span class="box"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg></span>ELT</label>
<label class="cb"><input type="checkbox" checked><span class="box"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg></span>Engineering</label>
<label class="cb"><input type="checkbox"><span class="box"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg></span>Marketing and PMM</label>
<label class="cb"><input type="checkbox" disabled><span class="box"><svg class="tick" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-check"/></svg></span>Sales (needs sign-off from Priya)</label>
</fieldset>
</div>
</div>
<script>document.getElementById("all").indeterminate=true;document.querySelectorAll(".ck").forEach(c=>c.addEventListener("click",()=>c.setAttribute("aria-checked",c.getAttribute("aria-checked")==="true"?"false":"true")))</script></body></html>
