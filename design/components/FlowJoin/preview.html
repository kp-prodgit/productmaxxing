<div class="pv">
<figure class="flow-fig">
<figcaption><b>PMX and PMX Engine meet at two narrow bridges, and each ends at a person.</b><span>Released strategy goes to the product managers. Customer evidence comes back to you as counts. Nothing moves unless a person approves it.</span></figcaption>
<ol class="flow">
<li class="lane"><span class="lane-name">From PMX Engine</span><ol>
<li class="station at-mac"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-mac"/></svg>PMX Engine, on your Mac</span><b>Strategy is released</b><small>Product managers come last, after you approve them.</small></div></li>
<li class="station at-reader"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-page"/></svg>Product managers' page</span><b>Product managers read it</b><small>What Engineering sees, with a switch per vertical.</small></div></li>
</ol></li>
<li class="lane"><span class="lane-name">Into PMX</span><ol>
<li class="station at-you"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-person"/></svg>You and a code owner</span><b>A second code owner merges</b><small>Claude opens the pull request from what the page shows.</small></div></li>
<li class="station at-repo"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-branch"/></svg>In the PMX repo</span><b>Team memory</b><small>Agents read it. No task copies it.</small></div></li>
<li class="station at-linear"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-board"/></svg>In Linear</span><b>Open themes become labels</b><small>Only themes every group may see.</small></div><p class="flow-note"><b>Restricted theme:</b> never a label.</p></li>
</ol></li>
<li class="lane"><span class="lane-name">Back to PMX Engine</span><ol>
<li class="station at-mac"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-mac"/></svg>PMX, on your Mac</span><b>Evidence comes back as counts</b><small>Tasks and sources per theme. No titles or quotes.</small></div></li>
<li class="station at-you"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-person"/></svg>You, in the studio</span><b>You accept each count</b><small>Mapped to a roadmap theme. It never reaches a page.</small></div></li>
</ol></li>
</ol>
</figure>
