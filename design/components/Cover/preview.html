<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:var(--bg)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--bg)}
.cv svg{position:absolute;inset:0}
.cv .t{position:absolute;left:32px;bottom:28px;width:440px}
.cv h1{margin:0;font:700 120px/.9 var(--font-sans);letter-spacing:-.045em;color:var(--fg)}
.cv p{margin:16px 0 0;font:400 14px/20px var(--font-sans);color:var(--fg-2)}
.ink{fill:var(--fg)}.acc{fill:var(--accent)}.soft{fill:var(--accent-soft)}.sun{fill:var(--sunken)}
.mac{fill:var(--mac)}.cla{fill:var(--claude)}.lin{fill:var(--linear)}.hel{fill:var(--held)}
.ln{stroke:var(--line-2);stroke-width:2;fill:none}.on{fill:var(--accent-fg)}.bgc{fill:var(--bg)}
.blk{rx:var(--r-l)}
</style></head><body><div class="cv">
<!-- blocks: accent 208x192, fg 128x128, accent-soft 128x48, sunken 352x64 (all multiples of space-4/space-8), corners r-l
     arrangement: one tall accent slab with satellites, bleeding off the right edge
     pattern: geometric/modular row, as five 24px discs on one line: the release track, the system's own shape, in place colours
     steps and radii: space-4 16, space-5 24, space-8 64; r-l 14; discs r 12 -->
<svg viewBox="0 0 960 288" aria-hidden="true">
  <rect class="sun blk" x="528" y="192" width="352" height="64"/>
  <rect class="acc blk" x="528" y="-16" width="208" height="192"/>
  <rect class="ink blk" x="752" y="48" width="128" height="128"/>
  <rect class="soft blk" x="752" y="-16" width="128" height="48"/>
  <rect class="ink blk" x="896" y="-16" width="96" height="272"/>
  <path class="ln" d="M564 224H844"/>
  <circle class="mac" cx="564" cy="224" r="12"/><circle class="cla" cx="634" cy="224" r="12"/><circle class="acc" cx="704" cy="224" r="12"/><circle class="lin" cx="774" cy="224" r="12"/><circle class="bgc" cx="844" cy="224" r="12"/><circle class="ln" cx="844" cy="224" r="11"/>
</svg>
<div class="t"><h1>PMX</h1><p>Calm instruments for people who decide.</p></div>
</div></body></html>
