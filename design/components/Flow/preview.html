<div class="pv">

<figure class="flow-fig">
<figcaption><b>Vision, edition 2 is ready for Engineering. It waits on you.</b><span>Done stations show a check and the date. The current one is filled, and later ones are outlined.</span></figcaption>
<ol class="flow">
<li class="lane"><span class="lane-name">In the studio, on your Mac</span><ol>
<li class="station at-mac is-done"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-mac"/></svg>On your Mac</span><b>Write and mark sections</b><small>Choose who sees each one.</small><span class="stamp"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Done · 18 Nov</span></div></li>
<li class="station at-you is-done"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-person"/></svg>You, in the studio</span><b>You release</b><small>Edition 2. Nobody has it yet.</small><span class="stamp"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg>Done · 19 Nov</span></div></li>
<li class="station at-you is-now"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-key"/></svg>You, on your Mac</span><b>You approve for Engineering</b><small>Type Engineering in the dialog.</small><span class="stamp">Now · waiting on you</span></div><p class="flow-note"><b>Don't approve:</b> nothing is sent.</p></li>
</ol></li>
<li class="station at-claude is-later"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-spark"/></svg>In the Claude app</span><b>Claude sends it</b><small>To Engineering's three pages.</small></div></li>
<li class="station at-mac is-later"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-mac"/></svg>PMX Engine, on your Mac</span><b>PMX Engine checks it</b><small>Every page against the plan.</small></div><p class="flow-note"><b>Not as planned:</b> it stops and names the page.</p></li>
<li class="station at-reader is-later"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-page"/></svg>Each group's page</span><b>Engineering reads it</b><small>In Claude, updated in place.</small></div></li>
</ol>
</figure>

<figure class="flow-fig narrow">
<figcaption><b>PMX's evidence comes back to you as counts, never words.</b><span>At 400px wide the same flow runs downwards.</span></figcaption>
<ol class="flow">
<li class="station at-repo"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-branch"/></svg>In the PMX repo</span><b>Team memory</b><small>Released strategy that agents read.</small></div></li>
<li class="station at-linear"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-board"/></svg>In Linear</span><b>Open themes become labels</b><small>Only themes every group may see.</small></div></li>
<li class="station at-mac"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-mac"/></svg>PMX, on your Mac</span><b>Evidence comes back as counts</b><small>Tasks and sources per theme. No quotes.</small></div></li>
<li class="station at-you"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-person"/></svg>You, in the studio</span><b>You accept each count</b><small>It never reaches a page.</small></div><p class="flow-note"><b>Dropped:</b> nothing changes.</p></li>
</ol>
</figure>
