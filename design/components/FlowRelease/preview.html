<div class="pv">
<figure class="flow-fig">
<figcaption><b>A release reaches one group at a time, and only after you approve it.</b><span>You approve on your Mac. Claude moves only what PMX Engine prepared, and PMX Engine checks what arrived.</span></figcaption>
<ol class="flow">
<li class="station at-mac"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-mac"/></svg>In the studio, on your Mac</span><b>Write and mark sections</b><small>Choose who sees each one. Saving sends nothing.</small></div></li>
<li class="station at-you"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-person"/></svg>You, in the studio</span><b>You release</b><small>A new edition. Nobody has it yet.</small></div></li>
<li class="lane repeat"><span class="lane-name"><svg class="i" aria-hidden="true"><use href="#i-repeat"/></svg>Repeats for each group, in order: ELT, Engineering, Marketing and PMM, then Sales and Rest of GTM</span><ol>
<li class="station at-you"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-key"/></svg>You, on your Mac</span><b>You approve for the group</b><small>In a dialog, by typing the group's name.</small></div><p class="flow-note"><b>Don't approve:</b> nothing is sent.</p></li>
<li class="station at-claude"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-spark"/></svg>In the Claude app</span><b>Claude sends it</b><small>To the group's pages, when you type one command.</small></div></li>
<li class="station at-mac"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-mac"/></svg>PMX Engine, on your Mac</span><b>PMX Engine checks it</b><small>Each page against what was planned.</small></div><p class="flow-note"><b>Not as planned:</b> it stops and names the page.</p></li>
<li class="station at-reader"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-page"/></svg>Each group's page</span><b>The group reads it</b><small>In Claude. The page updates in place.</small></div></li>
<li class="station at-you"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-key"/></svg>You and the PM lead</span><b>Announce, then sign off</b><small>The PM lead posts it. After ELT, you record ELT's sign-off.</small></div></li>
</ol></li>
</ol>
</figure>
