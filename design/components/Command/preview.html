<div class="pv">
<div class="cmd" style="max-width:560px"><p>In the Claude app, type:</p><div class="well"><code id="c1">/pmxe-release vision@company.e1 elt</code><button class="copy" type="button" aria-describedby="c1"><svg class="i" aria-hidden="true"><use href="#i-check"/></svg><span>Copy</span></button></div></div>

<p class="sr-only" role="status" id="cs"></p>
</div>
<script>document.querySelectorAll(".cmd .copy").forEach(b=>b.addEventListener("click",()=>{const c=b.closest(".cmd"),t=b.querySelector("span");c.classList.add("is-copied");t.textContent="Copied";document.getElementById("cs").textContent="Copied";setTimeout(()=>{c.classList.remove("is-copied");t.textContent="Copy"},2000)}))</script></body></html>
