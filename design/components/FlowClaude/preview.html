<figcaption><b>Claude proposes. You decide what stays, and who sees it.</b><span>Claude reads only what you allowed. It never chooses who may see a section.</span></figcaption>
<ol class="flow">
<li class="station at-mac"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-mac"/></svg>In the studio, on your Mac</span><b>You ask Claude</b><small>Tick what it may read. The studio gives you one command.</small></div></li>
