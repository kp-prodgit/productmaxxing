# Publishes a prebuilt package for each version tag (v0.10.0, …) on the public repo, so installing pmx
# downloads one file and builds nothing. INSTALL.md and `pmx update --latest` check it against SHA256SUMS.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    if: github.repository == 'kp-prodgit/productmaxxing'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      # RENAME-1: Macs on 0.14.0 or older can only update a package named productgit. The bridge is the same build
      # under that name; on its first run it swaps itself for productmaxxing.
      - name: bridge package for Macs still on productgit
        run: |
          mkdir -p "$RUNNER_TEMP/bridge" && tar -xzf productmaxxing-*.tgz -C "$RUNNER_TEMP/bridge"
          node -e 'const f=process.argv[1],p=require(f),c=p.bin.pmx;p.name="productgit";p.bin={pmx:c,productgit:c};require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "$RUNNER_TEMP/bridge/package/package.json"
          npm pack --ignore-scripts "$RUNNER_TEMP/bridge/package"
      - run: shasum -a 256 productmaxxing-*.tgz productgit-*.tgz > SHA256SUMS && cat SHA256SUMS
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" productmaxxing-*.tgz productgit-*.tgz SHA256SUMS --title "pmx ${GITHUB_REF_NAME#v}" \
            --notes "Install: follow INSTALL.md (https://github.com/${{ github.repository }}/blob/main/INSTALL.md). Changes: CHANGELOG.md."
