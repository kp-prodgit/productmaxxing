<div class="pv">
<figure class="flow-fig">
<figcaption><b>Two people decide before an agent spends anything.</b><span>You approve each proposal, so nothing reaches Linear without you. A teammate marks the work Ready. Then you review the draft.</span></figcaption>
<ol class="flow">
<li class="station at-claude"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-spark"/></svg>In the Claude app</span><b>Meetings are collected</b><small>Saved to your Mac, every day at 12:30 and 17:30.</small></div></li>
<li class="station at-claude"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-spark"/></svg>Sent to Claude</span><b>Claude proposes tasks</b><small>From meetings that pass the privacy rules. Your to-dos stay on your Mac.</small></div><p class="flow-note"><b>Kept private:</b> one-on-ones, hiring, pay and more.</p></li>
<li class="station at-you"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-person"/></svg>You, on your Mac</span><b>You approve</b><small>Each proposal, in PMX's Inbox.</small></div><p class="flow-note"><b>Dropped:</b> it never leaves your Mac.</p></li>
<li class="station at-linear"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-board"/></svg>In Linear</span><b>Tasks wait in the pool</b><small>With source IDs only, never quotes.</small></div></li>
<li class="station at-you"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-person"/></svg>A teammate, on the team board</span><b>A teammate marks it Ready</b><small>This decides what agents spend on.</small></div></li>
<li class="station at-claude"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-spark"/></svg>Claude agent, on your Mac</span><b>An agent drafts the work</b><small>The draft must pass its checklist.</small></div><p class="flow-note"><b>Fails twice:</b> it moves to Blocked, saying why.</p></li>
<li class="station at-repo"><div class="node"><span class="place"><svg class="i" aria-hidden="true"><use href="#i-branch"/></svg>For you, in the team repo</span><b>You review the pull request</b><small>Accept, reject, or ask for a redo.</small></div></li>
</ol>
</figure>
