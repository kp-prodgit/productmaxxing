# Publishes a prebuilt package for each version tag (v0.10.0, …) on the public repo, so installing pmx
# downloads one file and builds nothing. INSTALL.md and `pmx update --latest` check it against SHA256SUMS.
# The same file then goes to npm through trusted publishing: npm trusts this workflow in this repo (OIDC), so no npm
# token is stored on any Mac or in the repo, and npm records where the package was built (provenance).
# A tag with a suffix, v0.41.0-next.2, is a test build (the `next` channel): the same
# steps, but GitHub marks the release as a prerelease and npm files it under the dist-tag `next`, so neither GitHub's
# "latest release" nor `npm install productmaxxing` ever gives one. A plain vX.Y.Z tag runs exactly as before.
name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  release:
    if: github.repository == 'kp-prodgit/productmaxxing'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Sets TEST_BUILD only for vX.Y.Z-next.N. Any tag that is neither that nor a plain vX.Y.Z stops here, before the
      # tests run and before anything is published, with one line saying which rule it broke: a number written with a
      # leading zero (next.01, 0.041.0), a suffix that isn't -next.N, or not three numbers at all (v0.41, v0.41.0.1,
      # v1.2.3+build). A plain vX.Y.Z tag takes no branch, so the variable stays unset, nothing is printed, and the
      # two steps that read the variable add nothing.
      - name: a release, or a test build for the next channel
        run: |
          n='(0|[1-9][0-9]*)'
          stop() { echo "Stopped before anything was published: the tag $GITHUB_REF_NAME $1" >&2; exit 1; }
          if [[ "$GITHUB_REF_NAME" =~ ^v$n\.$n\.$n-next\.$n$ ]]; then
            echo "TEST_BUILD=1" >> "$GITHUB_ENV"
            echo "$GITHUB_REF_NAME is a test build: a GitHub prerelease, and npm's dist-tag next"
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-next\.[0-9]+)?$ ]] && ! [[ "$GITHUB_REF_NAME" =~ ^v$n\.$n\.$n$ ]]; then
            stop "has a number written with a leading zero, which npm refuses as a version. Write each number plainly: next.1, not next.01."
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then
            stop "has a suffix that isn't -next.N. A release is vX.Y.Z, and a test build is vX.Y.Z-next.N."
          elif ! [[ "$GITHUB_REF_NAME" =~ ^v$n\.$n\.$n$ ]]; then
            stop "isn't a version of three numbers. A release is vX.Y.Z, and a test build is vX.Y.Z-next.N."
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      # RENAME-1: Macs on 0.14.0 or older can only update a package named productgit. The bridge is the same build
      # under that name; on its first run it swaps itself for productmaxxing.
      - name: bridge package for Macs still on productgit
        run: |
          mkdir -p "$RUNNER_TEMP/bridge" && tar -xzf productmaxxing-*.tgz -C "$RUNNER_TEMP/bridge"
          node -e 'const f=process.argv[1],p=require(f),c=p.bin.pmx;p.name="productgit";p.bin={pmx:c,productgit:c};require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "$RUNNER_TEMP/bridge/package/package.json"
          npm pack --ignore-scripts "$RUNNER_TEMP/bridge/package"
      - run: shasum -a 256 productmaxxing-*.tgz productgit-*.tgz > SHA256SUMS && cat SHA256SUMS
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A rerun (say, after npm refused) keeps the release as it is and takes its files, so npm gets those bytes.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release download "$GITHUB_REF_NAME" --clobber --pattern 'productmaxxing-*.tgz' --pattern SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" productmaxxing-*.tgz productgit-*.tgz SHA256SUMS --title "pmx ${GITHUB_REF_NAME#v}" ${TEST_BUILD:+--prerelease} \
              --notes "Install: follow INSTALL.md (https://github.com/${{ github.repository }}/blob/main/INSTALL.md). Changes: CHANGELOG.md."
          fi
      # The file npm gets is the one SHA256SUMS names. A rerun after npm already has the version skips this step.
      - name: npm 11.5.1 or later, for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version
      - name: publish to npm
        run: |
          v="${GITHUB_REF_NAME#v}"
          shasum -a 256 -c SHA256SUMS
          if [ "$(npm view "productmaxxing@$v" version 2>/dev/null)" = "$v" ]; then echo "npm already has productmaxxing $v"; exit 0; fi
          npm publish "./productmaxxing-$v.tgz" --access public ${TEST_BUILD:+--tag next}
